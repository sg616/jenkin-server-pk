# Jenkins credentials, applied by Configuration as Code (scripts/09-jenkins-casc.sh).
# No secret values here: ${VAR} is read from the file /etc/jenkins/secrets/VAR
# (the SECRETS directory), the kubeconfig via readFileBase64.
# JCasC owns the global credentials list: credentials added only in the UI are
# removed on the next start/reload. Add new ones here instead.
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "swr-login"
              username: "${SWR_USER}"
              password: "${SWR_PASS}"
              description: "SWR long-term login (managed by config/casc/credentials.yaml)"
          - file:
              scope: GLOBAL
              id: "cce-kubeconfig"
              fileName: "kubeconfig.json"
              secretBytes: "${readFileBase64:/etc/jenkins/secrets/cce-kubeconfig}"
              description: "CCE internal-endpoint kubeconfig (managed by config/casc/credentials.yaml)"
          # GitHub App: read-only access to the private repo sg616/jenkin-server-pk,
          # not tied to a person. Jenkins mints a 1-hour installation token per use.
          - gitHubApp:
              id: "github-app"
              appID: "${GITHUB_APP_ID}"
              privateKey: "${readFile:/etc/jenkins/secrets/github-app-key.pem}"
              owner: "sg616"
              description: "GitHub App for sg616 repos (managed by config/casc/credentials.yaml)"
          # Read access to the KOKO application repos, which live in the
          # DarazAPACIG org. The github-app credential above is scoped to owner
          # sg616 and CANNOT clone these, so the koko-bpo-sky47 pipelines need
          # their own credential. Used for:
          #   bnpl-bpo-portal-service, bnpl-bpo-portal-web,
          #   bnpl-keycloak-service, bnpl-build-config
          # Username is the GitHub login; password is a PAT with `repo` read
          # scope (a GitHub App installed on DarazAPACIG would be better -- it
          # is not tied to a person -- but that needs org-owner approval).
          - usernamePassword:
              scope: GLOBAL
              id: "github-darazapacig"
              username: "${GITHUB_DARAZ_USER}"
              password: "${GITHUB_DARAZ_TOKEN}"
              description: "DarazAPACIG org read access for the KOKO app repos (managed by config/casc/credentials.yaml)"
